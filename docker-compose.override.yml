services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: fastik-api-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 4200
      CORS_ORIGIN: http://localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-fastik}:${POSTGRES_PASSWORD:-fastik_password}@postgres:5432/${POSTGRES_DB:-fastik}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-2h}
      CHOKIDAR_USEPOLLING: true
    ports:
      - '4200:4200'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - fastik-api-node-modules:/app/node_modules
    command: npm run dev -w @fastik/backend

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: fastik-web-dev
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4200/api
      CHOKIDAR_USEPOLLING: true
    ports:
      - '80:5173'
    depends_on:
      api:
        condition: service_started
    volumes:
      - .:/app
      - fastik-web-node-modules:/app/node_modules
    command: npm run dev -w @fastik/frontend

volumes:
  fastik-api-node-modules:
  fastik-web-node-modules:
