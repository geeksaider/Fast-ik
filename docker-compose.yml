services:
  postgres:
    image: postgres:16-alpine
    container_name: fastik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fastik}
      POSTGRES_USER: ${POSTGRES_USER:-fastik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fastik_password}
    ports:
      - '5432:5432'
    volumes:
      - fastik-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-fastik} -d ${POSTGRES_DB:-fastik}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fastik-postgres-data:
