services:
  postgres:
    image: postgres:16-alpine
    container_name: fastik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fastik-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${FASTIK_API_IMAGE}
    container_name: fastik-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4200
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-2h}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:4200/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: ${FASTIK_WEB_IMAGE}
    container_name: fastik-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    container_name: fastik-caddy
    restart: unless-stopped
    environment:
      FASTIK_DOMAIN: ${FASTIK_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - fastik-caddy-data:/data
      - fastik-caddy-config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started

volumes:
  fastik-postgres-data:
  fastik-caddy-data:
  fastik-caddy-config:
